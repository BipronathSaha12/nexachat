server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/chatbot.devtechguru.cloud.key;
  ssl_certificate /etc/nginx/ssl-certificates/chatbot.devtechguru.cloud.crt;
  server_name chatbot.devtechguru.cloud;
  root /home/chatbot/htdocs/chatbot.devtechguru.cloud;

  access_log /home/chatbot/logs/nginx/access.log main;
  error_log /home/chatbot/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  client_max_body_size 2m;

  location @reverse_proxy {
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;

    # ADD -- the chat endpoint streams Server-Sent Events. With buffering on,
    #        nginx holds output until a 256k buffer fills, so the reply lands in
    #        one lump instead of token by token. This is the setting that makes
    #        progressive rendering work.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    # ADD -- this app speaks SSE, not websockets. Sending "Connection: Upgrade"
    #        on every request is wrong and defeats upstream keepalive.
    proxy_set_header Connection "";

    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;

    # Long enough for a full generation plus retries; the app sends an SSE
    # heartbeat every 15s so an idle-looking connection is not dropped.
    proxy_connect_timeout 30;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
  }

  include /etc/nginx/global_settings;

  add_header Cache-Control no-transform;

  index index.html;

  location ^~ /.well-known {
    auth_basic off;
    allow all;
    try_files $uri @reverse_proxy;
  }

  # ADD -- Django admin assets. DEBUG is off in production, so Django will not
  #        serve these itself; collectstatic writes them here.
  location /static/ {
    alias /home/chatbot/app/backend/staticfiles/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    try_files $uri @reverse_proxy;
  }
}
